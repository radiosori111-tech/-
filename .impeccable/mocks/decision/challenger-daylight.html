<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:#F1EEE7;color:#2A2A2C}
nav{display:flex;justify-content:space-between;align-items:center;height:76px;padding:0 80px;border-bottom:1px solid #D8D2C6;font-size:15px}
.brand{font-weight:700;font-size:18px}
nav ul{display:flex;gap:32px;list-style:none;color:#6E6A63}
.wrap{display:grid;grid-template-columns:1.25fr 1fr;height:824px}
.section{position:relative;border-right:1px solid #D8D2C6;overflow:hidden}
.poche{position:absolute;background:#2A2A2C}
.beam{position:absolute;left:120px;top:150px;width:700px;height:150px;background:linear-gradient(100deg,rgba(217,164,65,.55),rgba(217,164,65,0));transform:rotate(24deg);transform-origin:left top}
.shadow{position:absolute;background:#8FA3B8;opacity:.35}
.lab{position:absolute;font-size:13px;color:#6E6A63;font-variant-numeric:tabular-nums}
.copy{padding:80px 72px}
.copy small{font-size:14px;color:#9C7424;letter-spacing:.06em}
h1{font-family:'Noto Serif KR',serif;font-size:56px;line-height:1.2;margin:18px 0 22px;letter-spacing:-.03em}
.copy p{font-size:18px;line-height:1.8;color:#55514A}
.items{margin-top:48px;border-top:1px solid #D8D2C6}
.items div{padding:20px 0;border-bottom:1px solid #D8D2C6;display:flex;gap:24px;font-size:17px;font-weight:500}
.items span{width:64px;color:#9C7424;font-variant-numeric:tabular-nums;font-weight:400}
</style></head><body>
<nav><div class="brand">믿음의 게임, 실행</div><ul><li>아티클</li><li>뇌과학 이슈</li><li>습관 설계</li><li>소개</li><li>문의</li></ul></nav>
<div class="wrap">
<div class="section">
<div class="poche" style="left:80px;top:110px;width:640px;height:18px"></div>
<div class="poche" style="left:80px;top:110px;width:18px;height:560px"></div>
<div class="poche" style="left:702px;top:300px;width:18px;height:370px"></div>
<div class="poche" style="left:80px;top:652px;width:640px;height:18px"></div>
<div class="poche" style="left:98px;top:420px;width:300px;height:12px"></div>
<div class="beam"></div>
<div class="shadow" style="left:420px;top:432px;width:282px;height:220px"></div>
<div class="lab" style="left:110px;top:80px">단면 A — 동향 침실, 11월</div>
<div class="lab" style="left:460px;top:250px">07:40 빛이 침대 머리맡에 닿음</div>
<div class="lab" style="left:120px;top:690px">00:00 ─── 06:00 ─── 12:00 ─── 18:00 ─── 24:00</div>
</div>
<div class="copy"><small>뇌과학 · 습관 · 실행</small><h1>빛이 드는 자리에서<br>습관이 시작된다</h1><p>뇌와 마음, 그리고 습관 변화를 통한 삶의 긍정적 변화.</p>
<div class="items"><div><span>07:40</span>아침 햇빛 10분이 밤잠을 바꾸는 이유</div><div><span>12:00</span>도파민은 '쾌락 물질'이 아니다</div><div><span>21:00</span>잠든 사이 뇌는 기억을 정리한다</div></div></div>
</div>
</body></html>
