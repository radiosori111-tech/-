<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;color:#111827}
nav{display:flex;justify-content:space-between;align-items:center;height:72px;padding:0 120px;border-bottom:1px solid #E5E7EB;font-size:15px}
.brand{font-weight:700;font-size:19px;color:#2563EB}
nav ul{display:flex;gap:28px;list-style:none;color:#374151}
.slide{margin:40px 120px 0;height:340px;border-radius:12px;background:#E5E7EB;display:flex;align-items:flex-end;padding:40px}
.slide h1{font-size:40px;line-height:1.3;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin:40px 120px 0}
.thumb{height:150px;border-radius:8px;background:#D1D5DB}
.grid small{display:block;margin-top:14px;font-size:13px;color:#2563EB;font-weight:500}
.grid h3{margin-top:6px;font-size:17px;line-height:1.5;font-weight:700}
</style></head><body>
<nav><div class="brand">믿음의 게임, 실행</div><ul><li>홈</li><li>뇌과학</li><li>습관</li><li>수면</li><li>소개</li><li>문의</li></ul></nav>
<div class="slide"><h1>아침 햇빛 10분이<br>밤잠을 바꾸는 이유</h1></div>
<div class="grid">
<div><div class="thumb"></div><small>습관 형성</small><h3>새 습관이 자리 잡는 데 정말 21일이면 될까</h3></div>
<div><div class="thumb"></div><small>뇌과학 기초</small><h3>도파민은 '쾌락 물질'이 아니다</h3></div>
<div><div class="thumb"></div><small>수면 · 회복</small><h3>잠든 사이 뇌는 기억을 정리한다</h3></div>
<div><div class="thumb"></div><small>뇌과학 이슈</small><h3>스마트폰은 집중력을 정말 망가뜨릴까</h3></div>
</div>
</body></html>
