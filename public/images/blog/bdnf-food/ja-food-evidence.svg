<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" role="img" aria-label="食べ物・食事法とBDNF：根拠はどこまで来たか" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif"><title>食べ物・食事法とBDNF：根拠はどこまで来たか</title><rect x="0" y="0" width="1060" height="560" rx="18" fill="#ffffff" stroke="#d9e2ec"/><text x="40" y="50" font-size="23" fill="#1f2933" font-weight="700" text-anchor="start">食べ物・食事法とBDNF：根拠はどこまで来たか</text><text x="40" y="76" font-size="14" fill="#52606d" font-weight="400" text-anchor="start">人の研究か、動物の研究かで分けて見た地図</text><text x="54" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">項目</text><text x="300" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">人の研究</text><text x="530" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">動物の研究</text><text x="740" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">ひとことで</text><line x1="40" y1="122" x2="1020" y2="122" stroke="#1f2933"/><rect x="40" y="138" width="6" height="24" rx="3" fill="#2f855a"/><text x="54" y="156" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">地中海食（ナッツ）</text><text x="300" y="156" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">3年、243人</text><text x="530" y="156" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="740" y="156" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">BDNFが低い人↓（平均差は有意でない）</text><line x1="40" y1="172" x2="1020" y2="172" stroke="#d9e2ec"/><rect x="40" y="188" width="6" height="24" rx="3" fill="#2f855a"/><text x="54" y="206" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">ココアフラバノール</text><text x="300" y="206" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">12週、62〜75歳</text><text x="530" y="206" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="740" y="206" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">血中BDNF↑（再現は分かれる）</text><line x1="40" y1="222" x2="1020" y2="222" stroke="#d9e2ec"/><rect x="40" y="238" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="256" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">ブルーベリー</text><text x="300" y="256" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="530" y="256" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">12週、高齢ラット</text><text x="740" y="256" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">海馬BDNF↑、記憶力↑</text><line x1="40" y1="272" x2="1020" y2="272" stroke="#d9e2ec"/><rect x="40" y="288" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="306" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">スルフォラファン（ブロッコリー）</text><text x="300" y="306" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">臨床試験が進行中</text><text x="530" y="306" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">2か月、認知症モデルマウス</text><text x="740" y="306" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">海馬・皮質BDNF↑</text><line x1="40" y1="322" x2="1020" y2="322" stroke="#d9e2ec"/><rect x="40" y="338" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="356" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">オメガ3（DHA）</text><text x="300" y="356" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="530" y="356" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">脳損傷ラット</text><text x="740" y="356" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">低下したBDNFが正常に回復</text><line x1="40" y1="372" x2="1020" y2="372" stroke="#d9e2ec"/><rect x="40" y="388" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="406" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">食事量の調整・間欠的断食</text><text x="300" y="406" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">16件：増5・減5・変化なし6</text><text x="530" y="406" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">3か月、マウス</text><text x="740" y="406" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">動物は↑、人は分かれる</text><line x1="40" y1="422" x2="1020" y2="422" stroke="#d9e2ec"/><rect x="40" y="438" width="6" height="24" rx="3" fill="#c53030"/><text x="54" y="456" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">高脂肪・精製糖の食事</text><text x="300" y="456" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="530" y="456" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">2か月、ラット</text><text x="740" y="456" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">海馬BDNF↓、学習↓（避けたい）</text><line x1="40" y1="472" x2="1020" y2="472" stroke="#d9e2ec"/><rect x="40" y="508" width="14" height="14" rx="3" fill="#2f855a"/><text x="62" y="520" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">人の根拠あり</text><rect x="240" y="508" width="14" height="14" rx="3" fill="#b7791f"/><text x="262" y="520" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">動物の根拠が中心</text><rect x="440" y="508" width="14" height="14" rx="3" fill="#c53030"/><text x="462" y="520" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">避けたい食事</text><text x="40" y="552" font-size="12" fill="#52606d" font-weight="400" text-anchor="start">出典：本文の参考文献（Nutr Neurosci 2011、Nutr Healthy Aging 2016、Free Radic Biol Med 2008 ほか）</text></svg>