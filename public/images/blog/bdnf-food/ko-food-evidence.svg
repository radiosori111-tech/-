<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" role="img" aria-label="음식·식사법과 BDNF: 근거는 어디까지 왔나" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif"><title>음식·식사법과 BDNF: 근거는 어디까지 왔나</title><rect x="0" y="0" width="1060" height="560" rx="18" fill="#ffffff" stroke="#d9e2ec"/><text x="40" y="50" font-size="23" fill="#1f2933" font-weight="700" text-anchor="start">음식·식사법과 BDNF: 근거는 어디까지 왔나</text><text x="40" y="76" font-size="14" fill="#52606d" font-weight="400" text-anchor="start">사람 연구인지, 동물 연구인지로 나눠 본 지도</text><text x="54" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">항목</text><text x="300" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">사람 연구</text><text x="530" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">동물 연구</text><text x="740" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">한 줄 정리</text><line x1="40" y1="122" x2="1020" y2="122" stroke="#1f2933"/><rect x="40" y="138" width="6" height="24" rx="3" fill="#2f855a"/><text x="54" y="156" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">지중해식 (견과류)</text><text x="300" y="156" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">3년, 243명</text><text x="530" y="156" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="740" y="156" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">BDNF 낮은 사람↓ (평균 차이는 비유의)</text><line x1="40" y1="172" x2="1020" y2="172" stroke="#d9e2ec"/><rect x="40" y="188" width="6" height="24" rx="3" fill="#2f855a"/><text x="54" y="206" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">코코아 플라바놀</text><text x="300" y="206" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">12주, 62~75세</text><text x="530" y="206" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="740" y="206" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">혈중 BDNF↑ (재현은 엇갈림)</text><line x1="40" y1="222" x2="1020" y2="222" stroke="#d9e2ec"/><rect x="40" y="238" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="256" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">블루베리</text><text x="300" y="256" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="530" y="256" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">12주, 노령 쥐</text><text x="740" y="256" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">해마 BDNF↑, 기억력↑</text><line x1="40" y1="272" x2="1020" y2="272" stroke="#d9e2ec"/><rect x="40" y="288" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="306" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">설포라판 (브로콜리)</text><text x="300" y="306" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">임상시험 진행 중</text><text x="530" y="306" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">2개월, 치매 모델 쥐</text><text x="740" y="306" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">해마·피질 BDNF↑</text><line x1="40" y1="322" x2="1020" y2="322" stroke="#d9e2ec"/><rect x="40" y="338" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="356" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">오메가-3 (DHA)</text><text x="300" y="356" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="530" y="356" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">뇌 손상 쥐</text><text x="740" y="356" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">떨어진 BDNF를 정상으로 회복</text><line x1="40" y1="372" x2="1020" y2="372" stroke="#d9e2ec"/><rect x="40" y="388" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="406" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">식사량 조절·간헐적 단식</text><text x="300" y="406" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">16건: 증가5·감소5·없음6</text><text x="530" y="406" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">3개월, 쥐</text><text x="740" y="406" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">동물은↑, 사람은 엇갈림</text><line x1="40" y1="422" x2="1020" y2="422" stroke="#d9e2ec"/><rect x="40" y="438" width="6" height="24" rx="3" fill="#c53030"/><text x="54" y="456" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">고지방·정제 설탕 식단</text><text x="300" y="456" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="530" y="456" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">2개월, 쥐</text><text x="740" y="456" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">해마 BDNF↓, 학습↓ (피할 것)</text><line x1="40" y1="472" x2="1020" y2="472" stroke="#d9e2ec"/><rect x="40" y="508" width="14" height="14" rx="3" fill="#2f855a"/><text x="62" y="520" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">사람 근거 있음</text><rect x="240" y="508" width="14" height="14" rx="3" fill="#b7791f"/><text x="262" y="520" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">동물 근거 중심</text><rect x="440" y="508" width="14" height="14" rx="3" fill="#c53030"/><text x="462" y="520" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">피해야 할 식단</text><text x="40" y="552" font-size="12" fill="#52606d" font-weight="400" text-anchor="start">출처: 본문 참고 문헌 (Nutr Neurosci 2011, Nutr Healthy Aging 2016, Free Radic Biol Med 2008 외)</text></svg>