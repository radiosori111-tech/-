<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" role="img" aria-label="Food, eating patterns and BDNF: how far the evidence goes" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif"><title>Food, eating patterns and BDNF: how far the evidence goes</title><rect x="0" y="0" width="1060" height="560" rx="18" fill="#ffffff" stroke="#d9e2ec"/><text x="40" y="50" font-size="23" fill="#1f2933" font-weight="700" text-anchor="start">Food, eating patterns and BDNF: how far the evidence goes</text><text x="40" y="76" font-size="14" fill="#52606d" font-weight="400" text-anchor="start">A map split by human studies vs animal studies</text><text x="54" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">Item</text><text x="300" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">Human studies</text><text x="530" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">Animal studies</text><text x="740" y="112" font-size="13.5" fill="#52606d" font-weight="700" text-anchor="start">In one line</text><line x1="40" y1="122" x2="1020" y2="122" stroke="#1f2933"/><rect x="40" y="138" width="6" height="24" rx="3" fill="#2f855a"/><text x="54" y="156" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">Mediterranean diet (nuts)</text><text x="300" y="156" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">3 yrs, 243 people</text><text x="530" y="156" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="740" y="156" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">Fewer with low BDNF (mean diff. n.s.)</text><line x1="40" y1="172" x2="1020" y2="172" stroke="#d9e2ec"/><rect x="40" y="188" width="6" height="24" rx="3" fill="#2f855a"/><text x="54" y="206" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">Cocoa flavanols</text><text x="300" y="206" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">12 wks, ages 62–75</text><text x="530" y="206" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="740" y="206" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">Blood BDNF↑ (replication mixed)</text><line x1="40" y1="222" x2="1020" y2="222" stroke="#d9e2ec"/><rect x="40" y="238" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="256" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">Blueberries</text><text x="300" y="256" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="530" y="256" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">12 wks, aged rats</text><text x="740" y="256" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">Hippocampal BDNF↑, memory↑</text><line x1="40" y1="272" x2="1020" y2="272" stroke="#d9e2ec"/><rect x="40" y="288" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="306" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">Sulforaphane (broccoli)</text><text x="300" y="306" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">Clinical trial ongoing</text><text x="530" y="306" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">2 months, AD-model mice</text><text x="740" y="306" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">Hippocampal and cortical BDNF↑</text><line x1="40" y1="322" x2="1020" y2="322" stroke="#d9e2ec"/><rect x="40" y="338" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="356" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">Omega-3 (DHA)</text><text x="300" y="356" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="530" y="356" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">Brain-injured rats</text><text x="740" y="356" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">Lowered BDNF restored to normal</text><line x1="40" y1="372" x2="1020" y2="372" stroke="#d9e2ec"/><rect x="40" y="388" width="6" height="24" rx="3" fill="#b7791f"/><text x="54" y="406" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">Eating less / intermittent fasting</text><text x="300" y="406" font-size="13" fill="#2f855a" font-weight="600" text-anchor="start">16 studies: 5↑ 5↓ 6 none</text><text x="530" y="406" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">3 months, mice</text><text x="740" y="406" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">Up in animals, mixed in humans</text><line x1="40" y1="422" x2="1020" y2="422" stroke="#d9e2ec"/><rect x="40" y="438" width="6" height="24" rx="3" fill="#c53030"/><text x="54" y="456" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="start">High-fat, refined-sugar diet</text><text x="300" y="456" font-size="13" fill="#7b8794" font-weight="400" text-anchor="start">—</text><text x="530" y="456" font-size="13" fill="#b7791f" font-weight="600" text-anchor="start">2 months, rats</text><text x="740" y="456" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start">Hippocampal BDNF↓, learning↓ (avoid)</text><line x1="40" y1="472" x2="1020" y2="472" stroke="#d9e2ec"/><rect x="40" y="508" width="14" height="14" rx="3" fill="#2f855a"/><text x="62" y="520" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">Human evidence</text><rect x="240" y="508" width="14" height="14" rx="3" fill="#b7791f"/><text x="262" y="520" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">Mainly animal evidence</text><rect x="440" y="508" width="14" height="14" rx="3" fill="#c53030"/><text x="462" y="520" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">Diet to avoid</text><text x="40" y="552" font-size="12" fill="#52606d" font-weight="400" text-anchor="start">Sources: see references (Nutr Neurosci 2011, Nutr Healthy Aging 2016, Free Radic Biol Med 2008, and others)</text></svg>