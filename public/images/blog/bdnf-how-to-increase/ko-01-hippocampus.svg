<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="1년 걷기 운동 후 해마 부피 변화" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif"><title>1년 걷기 운동 후 해마 부피 변화</title><rect x="0" y="0" width="800" height="460" rx="18" fill="#ffffff" stroke="#d9e2ec"/><text x="40" y="52" font-size="24" fill="#1f2933" font-weight="700" text-anchor="start">1년 걷기 운동 후 해마 부피 변화</text><text x="40" y="80" font-size="14" fill="#52606d" font-weight="400" text-anchor="start">노년층 120명 무작위 대조 실험 (주 3회 유산소 운동 vs 스트레칭)</text><line x1="120" y1="270" x2="720" y2="270" stroke="#1f2933" stroke-width="1.5"/><line x1="120" y1="160" x2="720" y2="160" stroke="#d9e2ec" stroke-dasharray="4 4"/><text x="108" y="165" font-size="13" fill="#52606d" font-weight="400" text-anchor="end">+2%</text><line x1="120" y1="215" x2="720" y2="215" stroke="#d9e2ec" stroke-dasharray="4 4"/><text x="108" y="220" font-size="13" fill="#52606d" font-weight="400" text-anchor="end">+1%</text><line x1="120" y1="325" x2="720" y2="325" stroke="#d9e2ec" stroke-dasharray="4 4"/><text x="108" y="330" font-size="13" fill="#52606d" font-weight="400" text-anchor="end">-1%</text><text x="108" y="275" font-size="13" fill="#52606d" font-weight="400" text-anchor="end">0%</text><rect x="210" y="160.0" width="140" height="110.0" rx="6" fill="#2f855a"/><text x="280" y="148.0" font-size="22" fill="#2f855a" font-weight="700" text-anchor="middle">+2.0%</text><text x="280" y="300" font-size="16" fill="#1f2933" font-weight="600" text-anchor="middle">유산소 운동군</text><rect x="470" y="270" width="140" height="77.0" rx="6" fill="#9aa5b1"/><text x="540" y="373.0" font-size="22" fill="#616e7c" font-weight="700" text-anchor="middle">−1.4%</text><text x="540" y="256" font-size="16" fill="#1f2933" font-weight="600" text-anchor="middle">스트레칭 대조군</text><text x="400" y="392" font-size="15" fill="#2f855a" font-weight="600" text-anchor="middle">노화로 1~2년 동안 줄어들 부피를 되돌린 셈</text><text x="40" y="424" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">앞쪽 해마 부피 · 1년 전 대비</text><text x="40" y="444" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">출처: Erickson 외, PNAS (2011)</text></svg>