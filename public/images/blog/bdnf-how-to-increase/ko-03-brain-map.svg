<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="무엇을 했을 때 뇌의 어디가 달라졌을까" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif"><title>무엇을 했을 때 뇌의 어디가 달라졌을까</title><rect x="0" y="0" width="800" height="640" rx="18" fill="#ffffff" stroke="#d9e2ec"/><text x="40" y="52" font-size="24" fill="#1f2933" font-weight="700" text-anchor="start">무엇을 했을 때 뇌의 어디가 달라졌을까</text><text x="40" y="80" font-size="14" fill="#52606d" font-weight="400" text-anchor="start">사람을 대상으로 한 뇌 영상 연구 (위치는 대략적인 표시)</text><path d="M 250 120 C 330 92 430 96 495 128 C 560 160 590 215 575 265 C 562 305 520 322 480 320 C 470 345 440 360 400 352 C 372 380 330 382 300 362 C 255 372 205 350 190 310 C 160 290 150 245 168 205 C 175 160 205 135 250 120 Z" fill="#f0f4f8" stroke="#7b8794" stroke-width="2.5"/><path d="M 300 125 C 310 170 290 200 320 240" fill="none" stroke="#bcccdc" stroke-width="2"/><path d="M 380 108 C 385 150 370 190 395 230" fill="none" stroke="#bcccdc" stroke-width="2"/><path d="M 460 125 C 450 165 470 200 450 245" fill="none" stroke="#bcccdc" stroke-width="2"/><path d="M 205 250 C 260 255 330 262 400 300" fill="none" stroke="#bcccdc" stroke-width="2"/><path d="M 520 175 C 535 210 525 240 545 268" fill="none" stroke="#bcccdc" stroke-width="2"/><path d="M 470 322 C 500 330 540 320 556 300 C 560 330 530 355 490 352 Z" fill="#e4e7eb" stroke="#7b8794" stroke-width="2"/><path d="M 420 352 C 425 380 430 400 440 420 L 462 420 C 455 395 452 370 455 345" fill="#e4e7eb" stroke="#7b8794" stroke-width="2"/><text x="160" y="140" font-size="13" fill="#52606d" font-weight="400" text-anchor="middle">앞</text><text x="600" y="140" font-size="13" fill="#52606d" font-weight="400" text-anchor="middle">뒤</text><circle cx="360" cy="300" r="17" fill="#2f855a" stroke="#fff" stroke-width="3"/><text x="360" y="306" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="500" cy="250" r="17" fill="#2b6cb0" stroke="#fff" stroke-width="3"/><text x="500" y="256" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="340" cy="205" r="17" fill="#6b46c1" stroke="#fff" stroke-width="3"/><text x="340" y="211" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="280" cy="295" r="17" fill="#c05621" stroke="#fff" stroke-width="3"/><text x="280" y="301" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="56" cy="445" r="11" fill="#2f855a"/><text x="56" y="450" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="78" y="450" font-size="15" fill="#1f2933" font-weight="700" text-anchor="start">해마</text><text x="78" y="470" font-size="12.5" fill="#52606d" font-weight="400" text-anchor="start">유산소 운동 1년: 부피 약 2%↑ (Erickson 2011) · 명상(MBSR) 8주: 회백질 밀도↑ (Hölzel 2011)</text><circle cx="56" cy="493" r="11" fill="#2b6cb0"/><text x="56" y="498" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="78" y="498" font-size="15" fill="#1f2933" font-weight="700" text-anchor="start">측두-두정 시각운동 영역</text><text x="78" y="518" font-size="12.5" fill="#52606d" font-weight="400" text-anchor="start">저글링 3개월: 회백질↑, 그만두고 3개월 뒤 다시 줄어듦 (Draganski 2004)</text><circle cx="56" cy="541" r="11" fill="#6b46c1"/><text x="56" y="546" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="78" y="546" font-size="15" fill="#1f2933" font-weight="700" text-anchor="start">대상피질 · 섬엽 · 뇌량 · 감각운동피질</text><text x="78" y="566" font-size="12.5" fill="#52606d" font-weight="400" text-anchor="start">춤 6개월: 부피↑ + 혈중 BDNF↑ (같은 강도의 운동군은 BDNF 변화 없음, Rehfeld 2018)</text><circle cx="56" cy="589" r="11" fill="#c05621"/><text x="56" y="594" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="78" y="594" font-size="15" fill="#1f2933" font-weight="700" text-anchor="start">왼쪽 측두피질 · 체성감각 영역</text><text x="78" y="614" font-size="12.5" fill="#52606d" font-weight="400" text-anchor="start">소설 읽기 9일: 연결성↑, 다 읽은 뒤 5일간 일부 유지 (Berns 2013)</text></svg>