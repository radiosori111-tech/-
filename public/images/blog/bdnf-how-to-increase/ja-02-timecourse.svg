<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="1回の運動 vs 続ける運動：血中BDNFの流れ" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif"><title>1回の運動 vs 続ける運動：血中BDNFの流れ</title><rect x="0" y="0" width="800" height="440" rx="18" fill="#ffffff" stroke="#d9e2ec"/><text x="40" y="52" font-size="24" fill="#1f2933" font-weight="700" text-anchor="start">1回の運動 vs 続ける運動：血中BDNFの流れ</text><text x="40" y="80" font-size="14" fill="#52606d" font-weight="400" text-anchor="start">概念図・実測値ではなく研究結果の傾向を描いたもの</text><line x1="90" y1="330" x2="740" y2="330" stroke="#1f2933"/><line x1="90" y1="330" x2="90" y2="110" stroke="#1f2933"/><text x="740" y="356" font-size="13" fill="#52606d" font-weight="400" text-anchor="end">時間（週）</text><text x="60" y="220" font-size="13" fill="#52606d" transform="rotate(-90 60 220)" text-anchor="middle">血中BDNF</text><path d="M 90 280.0 L 120.0 277.5 L 132.0 207.5 L 160.0 271.5 L 200.0 270.7 L 200.0 270.7 L 212.0 194.7 L 240.0 264.7 L 280.0 263.9 L 280.0 263.9 L 292.0 181.9 L 320.0 257.9 L 360.0 257.2 L 360.0 257.2 L 372.0 169.2 L 400.0 251.2 L 440.0 250.4 L 440.0 250.4 L 452.0 156.4 L 480.0 244.4 L 520.0 243.6 L 520.0 243.6 L 532.0 143.6 L 560.0 237.6 L 600.0 236.8 L 600.0 236.8 L 612.0 130.8 L 640.0 230.8 L 680.0 230.1 L 680.0 230.1 L 692.0 118.1 L 720.0 224.1 L 760.0 223.3" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linejoin="round"/><line x1="90" y1="280.0" x2="740" y2="225.0" stroke="#c05621" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="132" cy="207.46153846153845" r="5" fill="#2b6cb0"/><text x="146" y="118" font-size="14" fill="#2b6cb0" font-weight="600" text-anchor="start">運動直後に一時的に上昇 → 回復期に元に戻る</text><text x="730" y="312" font-size="14" fill="#c05621" font-weight="600" text-anchor="end">続けると基礎値と反応の幅がともに大きくなる</text><text x="40" y="412" font-size="12" fill="#52606d" font-weight="400" text-anchor="start">根拠：Knaepen ら, Sports Medicine (2010)・Szuhany ら, J Psychiatr Res (2015)</text></svg>