<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="1年間のウォーキング後の海馬の体積変化" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif"><title>1年間のウォーキング後の海馬の体積変化</title><rect x="0" y="0" width="800" height="460" rx="18" fill="#ffffff" stroke="#d9e2ec"/><text x="40" y="52" font-size="24" fill="#1f2933" font-weight="700" text-anchor="start">1年間のウォーキング後の海馬の体積変化</text><text x="40" y="80" font-size="14" fill="#52606d" font-weight="400" text-anchor="start">高齢者120人のランダム化比較試験（週3回の有酸素運動 vs ストレッチ）</text><line x1="120" y1="270" x2="720" y2="270" stroke="#1f2933" stroke-width="1.5"/><line x1="120" y1="160" x2="720" y2="160" stroke="#d9e2ec" stroke-dasharray="4 4"/><text x="108" y="165" font-size="13" fill="#52606d" font-weight="400" text-anchor="end">+2%</text><line x1="120" y1="215" x2="720" y2="215" stroke="#d9e2ec" stroke-dasharray="4 4"/><text x="108" y="220" font-size="13" fill="#52606d" font-weight="400" text-anchor="end">+1%</text><line x1="120" y1="325" x2="720" y2="325" stroke="#d9e2ec" stroke-dasharray="4 4"/><text x="108" y="330" font-size="13" fill="#52606d" font-weight="400" text-anchor="end">-1%</text><text x="108" y="275" font-size="13" fill="#52606d" font-weight="400" text-anchor="end">0%</text><rect x="210" y="160.0" width="140" height="110.0" rx="6" fill="#2f855a"/><text x="280" y="148.0" font-size="22" fill="#2f855a" font-weight="700" text-anchor="middle">+2.0%</text><text x="280" y="300" font-size="16" fill="#1f2933" font-weight="600" text-anchor="middle">有酸素運動群</text><rect x="470" y="270" width="140" height="77.0" rx="6" fill="#9aa5b1"/><text x="540" y="373.0" font-size="22" fill="#616e7c" font-weight="700" text-anchor="middle">−1.4%</text><text x="540" y="256" font-size="16" fill="#1f2933" font-weight="600" text-anchor="middle">ストレッチ対照群</text><text x="400" y="392" font-size="15" fill="#2f855a" font-weight="600" text-anchor="middle">加齢で1〜2年かけて減る分を取り戻した計算</text><text x="40" y="424" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">海馬前部の体積・1年前との比較</text><text x="40" y="444" font-size="13" fill="#52606d" font-weight="400" text-anchor="start">出典：Erickson ら, PNAS (2011)</text></svg>