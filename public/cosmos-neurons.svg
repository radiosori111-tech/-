@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes run{from{stroke-dashoffset:1000;opacity:0}8%{opacity:1}70%{opacity:1}to{stroke-dashoffset:0;opacity:0}}
